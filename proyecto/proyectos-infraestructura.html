					class="col-md pt-2 pt-md-0 d-md-flex align-items-end justify-content-end">
					<h3 class="text-center pt-3 mb-md-0"><i
							class="fa-solid fa-network-wired"></i> Infraestructura</h3>

			</div>

					<figure>
						<h3 class="badge">Datacenter académico</h3>

						<h4><span class="me-2"><i
									class="fa-solid fa-network-wired"></i></span>Unicom global</h4>
						<p>El proyecto contempla el diseño, despliegue, integración, aseguramiento
							y monitoreo de una infraestructura de red basada en estándares
							empresariales, garantizando interoperabilidad, seguridad perimetral,
							control de acceso a aplicaciones, listas negras y administración
							centralizada.</p>
						<h6>27, 28 y 29 de octubre | 10 am - 8 pm</h6>
					</figure>
					<!-- Inicio modal -->
					<div class="modal" tabindex="-1" id="datacenter">

									<img src="img/datacenter.jpg" alt class="img-fluid">
								</div>
							</div>
						</div>
					</div>
					<!-- Fin modal -->
					<figure>
						<h3 class="badge">Ágora</h3>
						<a href="#" data-bs-toggle="modal" data-bs-target="#agora"><i
								class="fa-solid fa-route"></i></a>
						<h4><span class="me-2"><i
									class="fa-solid fa-network-wired"></i></span>Sumo 360</h4>
						<p>SUMO 360 es una competencia de robótica educativa en la que equipos de
							estudiantes diseñan, construyen, programan y ponen a prueba robots sumo
							autónomos. El desafío consiste en combinar ingeniería, electrónica,
							programación, diseño mecánico y pensamiento estratégico para superar al
							oponente dentro de un dohyo.
							<br><br>
							La competencia busca convertir el aprendizaje STEAM en una experiencia
							emocionante, práctica y memorable, en la que las ideas se transforman en
							máquinas capaces de tomar decisiones y competir.</p>
						<h6>27, 28 y 29 de octubre | 10 am - 8 pm</h6>
					</figure>
					<!-- Inicio modal -->
					<div class="modal" tabindex="-1" id="agora">
						<div class="modal-dialog modal-dialog-centered">
							<div class="modal-content">

								</div>
								<div class="modal-body">
									<img src="img/agora-a.jpg" alt class="img-fluid">
								</div>
							</div>
						</div>
					</div>
					<!-- Fin modal -->
					<figure>
						<h3 class="badge">Ambiente 609 - Taller redes</h3>
						<a href="#" data-bs-toggle="modal" data-bs-target="#609"><i
								class="fa-solid fa-route"></i></a>
						<h4><span class="me-2"><i
									class="fa-solid fa-network-wired"></i></span>SmartTech: Soluciones IoT
							para Monitoreo Ambiental, Videovigilancia y Acceso</h4>
						<p>Soluciones IoT para Monitoreo Ambiental, Videovigilancia y Acceso, es
							un proyecto que reúne soluciones aplicadas de CCTV, control de acceso,
							domótica y electrónica aplicada a IoT, desarrolladas por los aprendices
							del programa de IITIC. A través de maquetas funcionales basadas en
							Micro:bit y Arduino, se simula el sistema de monitoreo ambiental del
							centro de datos del CGMLTI, con medición de temperatura, gases y la
							activación automática de ventilación y sistemas de alerta.
							<br><br>
							El proyecto integra además domótica inteligente, mediante el control
							automatizado de luces, tomacorrientes, ventiladores y chapas digitales,
							todo gestionado desde asistentes de voz, conformando un ecosistema
							completo de tecnologías para la seguridad, automatización y control
							ambiental.</p>
						<h6>Fecha y hora por definir</h6>
					</figure>
